[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# BSC 主网自 Hertz 硬分叉起支持 Shanghai 操作码（PUSH0）；不用 cancun，避免部署到 BSC 时因 EVM 版本不匹配而失败
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
# fork 测试默认走公共 RPC，限流严重时可用 BSC_RPC_URL 覆盖
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 512

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
